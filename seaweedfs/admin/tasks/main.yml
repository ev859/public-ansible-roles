---
# tasks file for roles/seaweedfs/admin

- name: testing is seaweedfs_admin_list is defined
  assert:
    that:
      - seaweedfs_admin_list is defined
    fail_msg: "Required variable 'seaweedfs_admin_list' is not defined"

- name: Include task for each object
  include_tasks: tasks/configure_admin.yaml
  loop: "{{ seaweedfs_admin_list }}"
  loop_control:
    loop_var: admin
  vars:
    container_name: "{{ admin.container_name }}"
    svc_port: "{{ admin.port }}"
    svc_port_grpc: "{{ admin.port_grpc }}"
    masters: "{{ admin.masters }}"
    dataDir: "{{ admin.dataDir }}"
    adminPassword: "{{ admin.adminPassword }}"
    readOnlyPassword: "{{ admin.readOnlyPassword }}"
    readOnlyUser: "{{ admin.readOnlyUser }}"

