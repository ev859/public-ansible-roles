---
# tasks file for roles/seaweedfs/security

- name: disable seaweedfs security.toml
  when: not ( seaweedfs_security_enabled | bool )
  block:
  - name: remove /etc/seaweedfs/security.toml file
    ansible.builtin.file:
      state: absent
      path: /etc/seaweedfs/security.toml

- name: enable seaweedfs security.toml
  when: ( seaweedfs_security_enabled | bool )
  block:
  - name: testing is seaweedfs_security_JWT is defined
    assert:
      that:
        - seaweedfs_security_JWT is defined
      fail_msg: "Required variable 'seaweedfs_master_list' is not defined"
  - name: Create a /etc/seaweedfs directory
    ansible.builtin.file:
      path: "/etc/seaweedfs"
      state: directory
      mode: '0750'
      owner: 1000
      group: 1000
  - name: install /etc/seaweedfs/security.toml file
    ansible.builtin.template:
      src: templates/security.toml
      dest: /etc/seaweedfs/security.toml
      owner: root
      group: root
      mode: '0644'

  - name: install /etc/seaweedfs/CA.crt file
    ansible.builtin.copy:
      src: "files/{{ item }}"
      dest: "/etc/seaweedfs/{{ item }}"
      owner: root
      group: root
      mode: '0644'
    loop:
      - CA.crt
      - admin01.crt
      - admin01.key
      - client01.crt
      - client01.key
      - filer01.crt
      - filer01.key
      - master01.crt
      - master01.key
      - volume01.crt
      - volume01.key
      - worker01.crt
      - worker01.key

