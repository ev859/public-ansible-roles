---
- name:
  when:
    - store is defined
    - store == "leveldb3"
  block:
  - name: Create a /etc/seaweedfs directory
    ansible.builtin.file:
      path: "/etc/seaweedfs"
      state: directory
      mode: '0750'
      owner: 1000
      group: 1000
  - name: install leveldb3 filer
    ansible.builtin.template:
      src: "templates/filer-leveldb3.toml"
      dest: "/etc/seaweedfs/filer.toml"
      mode: "0644"
      owner: root
      group: root


- name: Create a directory
  ansible.builtin.file:
    path: "{{ defaultStoreDir }}"
    state: directory
    mode: '0755'
    owner: 1000
    group: 1000


- name: install {{ container_name }}.container
  ansible.builtin.template:
    src: templates/seaweedfs_filer.container
    dest: "/etc/containers/systemd/{{ container_name }}.container"
    owner: root
    group: root
    mode: '0644'
  register: seaweedfs_service

- name: reload systemctl if changed service
  ansible.builtin.shell:
    cmd: systemctl daemon-reload
  when: seaweedfs_service.changed

- name: restart {{ container_name }}.service if config changed
  ansible.builtin.systemd_service:
    daemon_reload: true
    name: "{{ container_name }}.service"
    state: restarted
    enabled: true
  when: seaweedfs_service.changed
