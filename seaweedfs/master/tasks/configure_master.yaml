---
- name: Create a directory
  ansible.builtin.file:
    path: "{{ mdir }}"
    state: directory
    mode: '0755'
    owner: 1000
    group: 1000


- name: Copy local file to remote destination
  ansible.builtin.template:
    src: templates/seaweedfs_master.container
    #dest: "/etc/systemd/system/{{ container_name }}.container"
    dest: "/etc/containers/systemd/{{ container_name }}.container"
    owner: root
    group: root
    mode: '0644'
  register: seaweedfs_service

- name: reload systemctl if changed service
  ansible.builtin.shell:
    cmd: systemctl daemon-reload
  when: seaweedfs_service.changed

- name: disable seaweedfs master.toml
  when: not ( seaweedfs_master_toml_enabled | bool )
  block:
  - name: remove /etc/seaweedfs/master.toml file
    ansible.builtin.file:
      state: absent
      path: /etc/seaweedfs/master.toml
    register: master_toml_removed

- name: enable seaweedfs master.toml
  when: ( seaweedfs_master_toml_enabled | bool )
  block:
  - name: Create a /etc/seaweedfs directory
    ansible.builtin.file:
      path: "/etc/seaweedfs"
      state: directory
      mode: '0750'
      owner: 1000
      group: 1000
  - name: install /etc/seaweedfs/master.toml file
    ansible.builtin.template:
      src: templates/master.toml
      dest: /etc/seaweedfs/master.toml
      owner: root
      group: root
      mode: '0644'
    register: master_toml_installed

- name: restart {{ container_name }}.service if config changed
  ansible.builtin.systemd_service:
    daemon_reload: true
    name: "{{ container_name }}.service"
    state: restarted
    enabled: true
  when: seaweedfs_service.changed or master_toml_removed.changed or master_toml_installed.changed
