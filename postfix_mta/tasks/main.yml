---
# tasks file for roles/postfix_mta

- name: Update apt repo and cache on all Debian/Ubuntu boxes
  apt: update_cache=yes force_apt_get=yes cache_valid_time=3600
- name: install packages
  apt:
    name:
    - mailutils
    - postfix
    update_cache: yes

- name:
  when: ( postfix_header_check_pcre | bool )
  block:
  - name: install postfix-pcre
    apt:
      name:
      - postfix-pcre
      update_cache: yes

- name:
  block:
  - name: 
    ansible.builtin.lineinfile:
      path: /etc/postfix/main.cf
      regexp: '^relayhost'
      line: 'relayhost = [{{ postfix_relayhost }}]:{{ postfix_relayhost_port }}'
      create: yes
      backup: yes
      state: present
  
  - name: 
    ansible.builtin.lineinfile:
      path: /etc/postfix/main.cf
      regexp: '^smtp_sasl_auth_enable'
      line: 'smtp_sasl_auth_enable = yes'
      create: yes
      backup: yes
      state: present
  
  - name: 
    ansible.builtin.lineinfile:
      path: /etc/postfix/main.cf
      regexp: '^smtp_sasl_security_options'
      line: 'smtp_sasl_security_options = noanonymous'
      create: yes
      backup: yes
      state: present
  
  - name: 
    ansible.builtin.lineinfile:
      path: /etc/postfix/main.cf
      regexp: '^smtp_tls_security_level'
      line: 'smtp_tls_security_level = encrypt'
      create: yes
      backup: yes
      state: present
  
  - name: 
    ansible.builtin.lineinfile:
      path: /etc/postfix/main.cf
      regexp: '^smtp_use_tls'
      line: 'smtp_use_tls = yes'
      create: yes
      backup: yes
      state: present
  
  - name: 
    ansible.builtin.lineinfile:
      path: /etc/postfix/main.cf
      regexp: '^smtp_tls_wrappermode'
      line: 'smtp_tls_wrappermode = yes'
      create: yes
      backup: yes
      state: present
  
  - name: 
    ansible.builtin.lineinfile:
      path: /etc/postfix/main.cf
      regexp: '^smtp_tls_security_level'
      line: 'smtp_tls_security_level = encrypt'
      create: yes
      backup: yes
      state: present
  
  - name: 
    ansible.builtin.lineinfile:
      path: /etc/postfix/main.cf
      regexp: '^smtp_sasl_password_maps'
      line: 'smtp_sasl_password_maps = hash:/etc/postfix/sasl_passwd'
      create: yes
      backup: yes
      state: present
  
  - name: 
    ansible.builtin.lineinfile:
      path: /etc/postfix/sasl_passwd
      regexp: '^[{{ postfix_relayhost }}]'
      line: '[{{ postfix_relayhost }}] {{ postfix_user }}:{{ postfix_pass }}'
      create: yes
      backup: yes
      mode: 0600
      owner: root
      group: root
      state: present
    register: sasl_passwd
  - name: 
    ansible.builtin.command:
      cmd: "postmap /etc/postfix/sasl_passwd"
    when: sasl_passwd.changed
  #register: sasl_passwd
  #notify: sasl_password_changed

  - name:
    when: ( postfix_enforce_correct_sender | bool )
    block:
    - name: 
      ansible.builtin.lineinfile:
        path: /etc/postfix/main.cf
        regexp: '^sender_canonical_maps'
        line: 'sender_canonical_maps = regexp:/etc/postfix/sender_canonical'
        create: yes
        backup: yes
        state: present
    - name:
      when: ( postfix_header_check_pcre | bool )
      block:
      - name: 
        ansible.builtin.lineinfile:
          path: /etc/postfix/main.cf
          regexp: '^smtp_header_checks'
          line: 'smtp_header_checks = pcre:/etc/postfix/header_checks'
          create: yes
          backup: yes
          state: present
    - name:
      when: not ( postfix_header_check_pcre | bool )
      block:
      - name: 
        ansible.builtin.lineinfile:
          path: /etc/postfix/main.cf
          regexp: '^smtp_header_checks'
          line: 'smtp_header_checks = regexp:/etc/postfix/header_checks'
          create: yes
          backup: yes
          state: present
  
  - name:
    when: not ( postfix_enforce_correct_sender | bool )
    block:
    - name: 
      ansible.builtin.lineinfile:
        path: /etc/postfix/main.cf
        regexp: '^sender_canonical_maps'
        line: 'sender_canonical_maps ='
        create: yes
        backup: yes
        state: present
    - name: 
      ansible.builtin.lineinfile:
        path: /etc/postfix/main.cf
        regexp: '^smtp_header_checks'
        line: 'smtp_header_checks ='
        create: yes
        backup: yes
        state: present
  
  - name: /etc/postfix/sender_canonical
    ansible.builtin.copy:
      dest: /etc/postfix/sender_canonical
      content: '/.+/    {{ postfix_sender_email }}'
      owner: root
      group: root
      mode: '0644'
      backup: yes
  - name:
    when: ( postfix_header_check_pcre | bool )
    block:
    - name: /etc/postfix/header_checks
      ansible.builtin.template:
        src: templates/header_checks
        dest: /etc/postfix/header_checks
        owner: root
        group: root
        mode: '0644'
        backup: yes
  - name:
    when: not ( postfix_header_check_pcre | bool )
    block:
    - name: /etc/postfix/header_checks
      ansible.builtin.copy:
        dest: /etc/postfix/header_checks
        content: '/^From:\s+.*/ REPLACE From: {{ inventory_hostname }} <{{ postfix_sender_email }}>'
        owner: root
        group: root
        mode: '0644'
        backup: yes
  notify: config changed 

